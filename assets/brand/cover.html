<!doctype html>
<!-- Source of assets/brand/cover.webp. Render at 1600x400, device scale 2, then save as WebP. -->
<html lang="en"><head><meta charset="utf-8"><title>Beam cover</title>
<style>
  html, body { margin: 0; width: 1600px; height: 400px; overflow: hidden; background: transparent; }
  .banner { position: relative; width: 1600px; height: 400px; border-radius: 28px; overflow: hidden; background: #f5f5f7;
    font-family: "Segoe UI", -apple-system, Inter, system-ui, sans-serif; }
  /* Soft colour behind the glass, so the frosting has something to blur. */
  .light { position: absolute; border-radius: 50%; filter: blur(60px); opacity: 0.42; }
  .l1 { width: 220px; height: 220px; left: 200px; top: 40px; background: #ff4fa3; }
  .l2 { width: 220px; height: 220px; left: 290px; top: 150px; background: #7c5cff; }
  .l3 { width: 180px; height: 180px; left: 160px; top: 170px; background: #ffb547; }
  .row { position: absolute; inset: 0; display: flex; align-items: center; gap: 56px; padding-left: 210px; }
  .icon { width: 216px; height: 216px; border-radius: 52px; display: grid; place-items: center;
    background: rgba(255, 255, 255, 0.66); backdrop-filter: blur(26px) saturate(180%); -webkit-backdrop-filter: blur(26px) saturate(180%);
    box-shadow: inset 0 1.5px 0 rgba(255, 255, 255, 0.95), inset 0 -1px 0 rgba(255, 255, 255, 0.35), inset 0 0 0 1px rgba(255, 255, 255, 0.55),
      0 24px 60px rgba(40, 30, 80, 0.16), 0 2px 6px rgba(40, 30, 80, 0.08); }
  .icon img { width: 128px; height: 128px; }
  .text img { display: block; height: 84px; margin-left: -4px; }
  .text p { margin: 22px 0 0; font-size: 30px; letter-spacing: -0.01em; color: #4b4b57; }
</style></head>
<body>
  <div class="banner">
    <div class="light l1"></div><div class="light l2"></div><div class="light l3"></div>
    <div class="row">
      <div class="icon"><img src="mark.svg" alt=""></div>
      <div class="text">
        <img src="wordmark-dark-ink.svg" alt="beam">
        <p>Design tools for coding agents. Clone, build and verify UI exactly.</p>
      </div>
    </div>
  </div>
</body></html>
